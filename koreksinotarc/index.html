<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Ayam Lengkap</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #f5f5f5, #eaeaea);
    font-size: 0.8rem;
}

.header, .main-card {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);
    border: 2px solid #d32f2f;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
}
    
.main-card {
    width: fit-content;
    min-width: 100%;
}
    
h5 { color:#d32f2f; font-weight:700; }

input, select {
    border-radius: 10px !important;
    border: 1px solid #ccc !important;
    background: rgba(255,255,255,0.9) !important;
    color: #333 !important;
}

/* 🔥 FIX INPUT BIAR MUAT ANGKA BESAR */
input[type="number"] {
    min-width: 110px;
    text-align: right;
    font-size: 0.9rem;
}

.input-harga {
    min-width: 130px;
}

.table thead { background:#f1f1f1; color:#333; }
.table tbody tr { background:#fff; color:#333; }

.hidden { display:none; }
.total-biru {
    text-align:right;
    font-weight:bold;
    color:#1976d2;
}
</style>
</head>

<body>

<div class="container-fluid px-2">

<div class="header text-center">
<h5>Kalkulator Ayam RC</h5>
<select id="supplier" class="form-control mt-2" onchange="switchMode()">
<option value="barokah">Barokah</option>
<option value="japfa">Japfa</option>
<option value="agro">Agro</option>
</select>
</div>

<!-- BAROKAH -->
<div id="barokahMode" class="main-card">
<input type="number" id="input-marinade" class="form-control mb-2" placeholder="Marinade">

<table class="table">
<thead>
<tr><th>Item</th><th>Qty</th><th>Berat</th><th>Harga</th><th>Subtotal</th><th>+Marinade</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div id="totalBarokah" class="total-biru">Total: Rp 0</div>
</div>

<!-- JAPFA -->
<div id="japfaMode" class="main-card hidden">

<input type="number" id="j_nota" class="form-control mb-2" placeholder="Total Nota">

<div id="marinadeWrapper">
<input type="number" id="j_marinade" class="form-control mb-2" placeholder="Marinade">
</div>

<table class="table">
<thead>
<tr><th>Bagian</th><th>Subtotal</th><th id="colFinal">+Marinade</th></tr>
</thead>
<tbody id="j_table"></tbody>
</table>

<div id="totalJapfa" class="total-biru">Total: Rp 0</div>
</div>

<!-- GABUNGAN -->
<div class="main-card">
<h6 style="color:#d32f2f">TOTAL BAROKAH/JAPFA/AGRO</h6>
<table class="table">
<thead>
<tr><th>Bagian</th><th>Total</th></tr>
</thead>
<tbody id="gabunganTable"></tbody>
</table>

<div id="totalGabungan" class="total-biru">Total: Rp 0</div>
</div>

</div>

<script>

// 🔥 FORMAT RUPIAH
function rupiah(angka){
    return "Rp " + Math.round(angka).toLocaleString("id-ID");
}

// ================= DATA =================
const dataAyam = [
{ nama: "Mentok", berat_sop: 150, harga: 37800 },
{ nama: "Dada", berat_sop: 180, harga: 37800 },
{ nama: "Paha Atas", berat_sop: 145, harga: 37800},
{ nama: "Paha Bawah", berat_sop: 95, harga: 37800},
{ nama: "Sayap", berat_sop: 105, harga: 36300 }
];

const japfaData = [
{nama:"Mentok", berat:150, kali:1},
{nama:"Dada", berat:180, kali:2},
{nama:"Paha Atas", berat:145, kali:2},
{nama:"Paha Bawah", berat:95, kali:2},
{nama:"Sayap", berat:105, kali:2}
];

// ================= STORAGE =================
let dataSupplier = {
    barokah:{},
    japfa:{},
    agro:{}
};

// ================= INIT =================
const tbody = document.getElementById("tbody");

dataAyam.forEach(item=>{
tbody.innerHTML+=`
<tr class="row-ayam" data-sop="${item.berat_sop}">
<td>${item.nama}</td>
<td><input type="number" class="input-qty form-control" value="0"></td>
<td class="display-brt">0</td>
<td><input type="number" class="input-harga form-control" value="${item.harga}"></td>
<td class="display-subtotal">0</td>
<td class="display-final">0</td>
</tr>`;
});

// ================= HITUNG BAROKAH =================
function hitungBarokah(){

let marinade = parseFloat(document.getElementById('input-marinade').value)||0;
let mPerB = marinade/5;

let totalBarokah = 0;
dataSupplier.barokah = {};

document.querySelectorAll('.row-ayam').forEach(row=>{

let nama = row.children[0].innerText;
let sop = parseFloat(row.getAttribute('data-sop'));
let qty = parseFloat(row.querySelector('.input-qty').value)||0;
let harga = parseFloat(row.querySelector('.input-harga').value) || 0;

let berat = (sop*qty)/1000;
let subtotal = berat*harga;
let final = subtotal + mPerB;

row.querySelector('.display-brt').innerText = berat.toFixed(2);
row.querySelector('.display-subtotal').innerText = rupiah(subtotal);
row.querySelector('.display-final').innerText = rupiah(final);

totalBarokah += final;
dataSupplier.barokah[nama] = final;

});

document.getElementById("totalBarokah").innerText = "Total: " + rupiah(totalBarokah);

gabungSemua();
}

// ================= HITUNG JAPFA =================
function hitungJapfa(){

let supplier = document.getElementById("supplier").value;

let nota = parseFloat(document.getElementById("j_nota").value)||0;
let marinade = parseFloat(document.getElementById("j_marinade").value)||0;

let pakaiMarinade = supplier !== "agro";
if(!pakaiMarinade) marinade=0;

let perBagian = pakaiMarinade ? marinade/5 : 0;

let html="";
let target = (supplier==="agro") ? "agro" : "japfa";

let totalJapfa = 0;
dataSupplier[target] = {};

japfaData.forEach(d=>{

let proporsi = (d.berat*d.kali)/1200;
let asli = proporsi*nota;
let final = asli + perBagian;

let nilai = pakaiMarinade ? final : asli;

dataSupplier[target][d.nama] = nilai;
totalJapfa += nilai;

html+=`
<tr>
<td>${d.nama}</td>
<td>${rupiah(asli)}</td>
<td class="colFinalCell">${rupiah(final)}</td>
</tr>`;
});

document.getElementById("j_table").innerHTML = html;

document.querySelectorAll(".colFinalCell").forEach(el=>{
el.style.display = pakaiMarinade ? "" : "none";
});

document.getElementById("colFinal").style.display = pakaiMarinade ? "" : "none";

document.getElementById("totalJapfa").innerText = "Total: " + rupiah(totalJapfa);

gabungSemua();
}

// ================= GABUNG =================
function gabungSemua(){

let html="";
let grandTotal = 0;

dataAyam.forEach(item=>{

let nama = item.nama;

let b = dataSupplier.barokah[nama] || 0;
let j = dataSupplier.japfa[nama] || 0;
let a = dataSupplier.agro[nama] || 0;

let total = b + j + a;
grandTotal += total;

html+=`
<tr>
<td>${nama}</td>
<td>${rupiah(total)}</td>
</tr>`;
});

document.getElementById("gabunganTable").innerHTML = html;
document.getElementById("totalGabungan").innerText = "Total: " + rupiah(grandTotal);
}

// ================= SWITCH =================
function switchMode(){

let s = document.getElementById("supplier").value;

document.getElementById("barokahMode").classList.toggle("hidden", s!=="barokah");
document.getElementById("japfaMode").classList.toggle("hidden", s==="barokah");

document.getElementById("marinadeWrapper").style.display = (s==="agro") ? "none":"block";

hitungJapfa();
}

// ================= EVENT =================
document.addEventListener("input", ()=>{
hitungBarokah();
hitungJapfa();
});

window.onload = ()=>{
hitungBarokah();
hitungJapfa();
};

</script>

</body>
</html>
