<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Real-time KS Tubun</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background: #121212; color: #fff; font-size: 0.8rem; }
.main-card { background: #1e1e1e; border-radius: 15px; padding: 12px; border: 1px solid #333; }
.header-app { background: linear-gradient(135deg, #d32f2f, #8b0000); padding: 15px; border-radius: 0 0 20px 20px; margin-bottom: 10px; }
.form-input { background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 6px; text-align: center; padding: 2px; }
.marinade-section { background: #252525; border-left: 4px solid #ffca28; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
.nota-compare-section { background: #1a2a3a; border-left: 4px solid #0dcaf0; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
.text-yellow { color: #ffca28; }
.text-cyan { color: #0dcaf0; }
.total-box { background: #000; border: 1px solid #444; border-radius: 12px; padding: 15px; margin-top: 10px; }
th { color: #777; font-size: 0.6rem; text-align: center; text-transform: uppercase; border: none !important; }
.td-data { border-bottom: 1px solid #333 !important; padding: 8px 2px !important; }
</style>
</head>

<body>

<div class="header-app text-center">
<h5 class="mb-0 fw-bold">KOREKSI NOTA AYAM BAROKAH</h5>
<small class="text-white-50">Rocket Chicken</small>
</div>

<div class="container-fluid">
<div class="main-card shadow-lg">

<div class="marinade-section d-flex justify-content-between align-items-center">
<div>
<label class="small text-muted d-block">TOTAL MARINADE (NOTA)</label>
<input type="number" id="input-marinade" value="0" class="form-control form-input" style="width: 100px;">
</div>
<div class="text-end">
<small class="text-muted d-block">Bagi 5 Bagian:</small>
<span class="text-yellow fw-bold" id="display-m-per-b">+ 0</span>
</div>
</div>

<div class="table-responsive">
<table class="table table-dark align-middle mb-3">
<thead>
<tr>
<th class="text-start">ITEM</th>
<th>QTY</th>
<th>BRT</th>
<th>HRG/KG</th>
<th>AYAM</th>
<th class="text-end text-yellow">FINAL</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="nota-compare-section">
<div class="fw-bold text-cyan mb-2 small">NOTA SUPPLIER</div>

<div class="d-flex align-items-center justify-content-between mb-2">
<span>TOTAL</span>
<input type="number" step="any" id="nota-brt-total" class="form-control form-input" style="width: 90px;">
<span>x</span>
<input type="number" id="nota-hrg-total" class="form-control form-input" style="width: 90px;">
<span id="res-nota-total">0</span>
</div>

<div class="d-flex align-items-center justify-content-between mb-2">
<span>SAYAP</span>
<input type="number" step="any" id="nota-brt-sayap" class="form-control form-input" style="width: 90px;">
<span>x</span>
<input type="number" id="nota-hrg-sayap" class="form-control form-input" style="width: 90px;">
<span id="res-nota-sayap">0</span>
</div>

<hr>

<div class="d-flex justify-content-between">
<span>TOTAL NOTA SUPPLIER:</span>
<span id="grand-total-nota">Rp 0</span>
</div>

<div class="d-flex justify-content-between">
<span>SELISIH:</span>
<span id="selisih-nota">Rp 0</span>
</div>
</div>

<div class="total-box">
<div class="d-flex justify-content-between">
<span>Total Ayam:</span>
<span id="total-ayam">Rp 0</span>
</div>

<hr>

<div class="d-flex justify-content-between">
<span>TOTAL NOTA REAL:</span>
<h5 id="total-semua">Rp 0</h5>
</div>
</div>

</div>
</div>

<script>
// DATA MASTER (dipindah dari Python)
const dataAyam = [
{ nama: "Mentok", berat_sop: 150, harga: 38800 },
{ nama: "Dada", berat_sop: 180, harga: 38800 },
{ nama: "Paha Atas", berat_sop: 145, harga: 38800 },
{ nama: "Paha Bawah", berat_sop: 95, harga: 38800 },
{ nama: "Sayap", berat_sop: 105, harga: 37300 }
];

// RENDER TABLE
const tbody = document.getElementById("tbody");

dataAyam.forEach(item => {
tbody.innerHTML += `
<tr class="row-ayam" data-sop="${item.berat_sop}">
<td>${item.nama}</td>
<td><input type="number" class="form-control form-input input-qty" value="0"></td>
<td class="display-brt">0</td>
<td><input type="number" class="form-control form-input input-harga" value="${item.harga}"></td>
<td class="display-subtotal">0</td>
<td class="display-final text-success fw-bold">0</td>
</tr>
`;
});

// FUNCTION HITUNG (ASLI, TIDAK DIUBAH)
function hitung() {

let marinade = parseFloat(document.getElementById('input-marinade').value) || 0;
let mPerB = marinade / 5;
document.getElementById('display-m-per-b').innerText = "+ " + mPerB.toLocaleString('id-ID');

let totalAyamSajaKita = 0;

document.querySelectorAll('.row-ayam').forEach(row => {

let sop = parseFloat(row.getAttribute('data-sop'));
let qty = parseFloat(row.querySelector('.input-qty').value) || 0;
let harga = parseFloat(row.querySelector('.input-harga').value) || 0;

let beratStd = (sop * qty) / 1000;
row.querySelector('.display-brt').innerText = beratStd.toFixed(2);

let subtotalAyam = beratStd * harga;
row.querySelector('.display-subtotal').innerText = Math.round(subtotalAyam).toLocaleString('id-ID');

let final = subtotalAyam + mPerB;
row.querySelector('.display-final').innerText = Math.round(final).toLocaleString('id-ID');

totalAyamSajaKita += subtotalAyam;
});

document.getElementById('total-ayam').innerText = "Rp " + Math.round(totalAyamSajaKita).toLocaleString('id-ID');
document.getElementById('total-semua').innerText = "Rp " + Math.round(totalAyamSajaKita + marinade).toLocaleString('id-ID');

// NOTA
let notaBrtTot = parseFloat(document.getElementById('nota-brt-total').value) || 0;
let notaHrgTot = parseFloat(document.getElementById('nota-hrg-total').value) || 0;
let resNotaTotal = notaBrtTot * notaHrgTot;

document.getElementById('res-nota-total').innerText = Math.round(resNotaTotal).toLocaleString('id-ID');

let notaBrtSayap = parseFloat(document.getElementById('nota-brt-sayap').value) || 0;
let notaHrgSayap = parseFloat(document.getElementById('nota-hrg-sayap').value) || 0;
let resNotaSayap = notaBrtSayap * notaHrgSayap;

document.getElementById('res-nota-sayap').innerText = Math.round(resNotaSayap).toLocaleString('id-ID');

let grandTotalNota = resNotaTotal + resNotaSayap;

document.getElementById('grand-total-nota').innerText = "Rp " + Math.round(grandTotalNota).toLocaleString('id-ID');

let selisih = totalAyamSajaKita - grandTotalNota;

document.getElementById('selisih-nota').innerText = "Rp " + Math.round(selisih).toLocaleString('id-ID');
}

// EVENT
document.addEventListener('input', hitung);
window.onload = hitung;

</script>

</body>
  </html>
