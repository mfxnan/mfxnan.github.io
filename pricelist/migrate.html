<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import menu RC KS Tubun</title>
<style>body{font:16px system-ui;max-width:760px;margin:24px auto;padding:0 14px;background:#f5f5f5;color:#171717}.box{background:white;padding:18px;border-radius:14px;margin-bottom:14px}input,button{font:inherit;padding:10px;border-radius:8px}input{width:100%;box-sizing:border-box;margin:7px 0;border:1px solid #ccc}button{background:#c8102e;color:white;border:0;font-weight:bold;margin:5px 5px 5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:12px;border-radius:8px}</style></head><body>
<h1>Import data menu lama</h1>
<div class="box"><p>Tool ini mengambil semua kartu <code>.item</code> dari website yang sedang aktif, lalu mengimpor ke tabel Supabase. Jalankan hanya setelah SQL dan akun admin disiapkan. Tidak menghapus data lama.</p>
<label>URL Supabase</label><input id="url" placeholder="https://xxxx.supabase.co">
<label>Publishable key (bukan secret/service_role)</label><input id="key" placeholder="sb_publishable_...">
<label>Email admin</label><input id="email" type="email">
<label>Password admin</label><input id="password" type="password">
<button id="scan">1. Scan website lama</button><button id="login">2. Login & import</button><pre id="out">Belum mulai.</pre></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb=null, records=[];
const out=document.getElementById('out');
document.getElementById('scan').onclick=async()=>{
 try{
  out.textContent='Mengambil halaman...';
  const r=await fetch('./index.html',{cache:'no-store'});if(!r.ok)throw new Error('Gagal membaca ./index.html: '+r.status);
  const html=await r.text(),doc=new DOMParser().parseFromString(html,'text/html');
  records=[...doc.querySelectorAll('.item')].map(el=>{
    const name=el.querySelector('h3')?.textContent.trim()||'';
    const description=el.querySelector('p')?.textContent.trim()||'';
    const priceText=el.querySelector('.price')?.textContent||'';
    const price=Number(priceText.replace(/[^\d]/g,''));
    const category=el.dataset.category||'lainnya';
    const search_terms=el.dataset.search||'';
    return {name,description,price,category,search_terms,active:true};
  }).filter(x=>x.name && Number.isSafeInteger(x.price));
  out.textContent='Ditemukan '+records.length+' item .item dari index.html.\\n\\n'+records.slice(0,8).map(x=>x.category+' | '+x.name+' | Rp'+x.price).join('\\n')+'\\n...\\n\\nPromo banner terpisah tidak diimpor sebagai kartu menu. Harga dan teks promo yang ditulis di dalam banner perlu dipindah/dirapikan secara terpisah.';
 }catch(e){out.textContent='Gagal scan: '+e.message;}
};
document.getElementById('login').onclick=async()=>{
 try{
  if(!records.length)throw new Error('Klik Scan website lama dulu.');
  const url=document.getElementById('url').value.trim(),key=document.getElementById('key').value.trim();
  sb=window.supabase.createClient(url,key);
  const {error:authError}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if(authError)throw authError;
  out.textContent='Login berhasil. Mengimpor '+records.length+' menu...';
  // Unique constraint category,name makes this repeatable without duplicating rows.
  const {data,error}=await sb.from('menu_items').upsert(records,{onConflict:'category,name'}).select('id,name,category,price');
  if(error)throw error;
  out.textContent='Selesai. Berhasil mengimpor/memperbarui '+(data?.length??records.length)+' menu. Data lama tidak dihapus.\\nPeriksa hasilnya di admin.html. Setelah selesai, hapus file migrate.html dari repository atau jangan publikasikan lagi.';
 }catch(e){out.textContent='Import gagal: '+(e.message||String(e))+'\\nPastikan SQL, UID admin, URL, key, dan login benar.';}
};
</script></body></html>
